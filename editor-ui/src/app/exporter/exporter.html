<div class="exporter">
  <h3>Exporter</h3>
  <button (click)="exportPython()">Export to Python (LangGraph)</button>


  @if (pythonCode) {
    <pre style="max-height:300px;overflow:auto;background:#f6f6f6;padding:8px">{{pythonCode}}</pre>
  }


  @if (pythonBlobUrl) {
    <a [href]="pythonBlobUrl" download="workflow.py">Download python</a>
  }
</div>
